<!DOCTYPE html>
<html>
<head>
<title>{{page.title}}</title>

<meta http-equiv="content-type" content="text/html; charset=utf-8">
<link rel="stylesheet" href="https://use.typekit.net/hgl6iue.css">
<link rel="stylesheet" href="{{site.baseurl}}/css/styles.css">

</head>

<body>

<div class="topBox">
  <div class="head">{{page.title}}</div>
  <br>
  {% if page.subtitle %}
    <div class="subhead">
      {% if page.subtitle-link %}
        <a class="invisible" href="{{page.subtitle-link}}">{{page.subtitle}}</a>
      {% else %}
        {{page.subtitle}}
      {% endif %}
    </div>
  {% endif %}
</div>

<div class="box">
  {{content}}
</div>

</body>
</html>
